apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp8-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exp8-app
  template:
    metadata:
      labels:
        app: exp8-app
    spec:
      containers:
      - name: exp8-container
        image: devops-exp8:v1
        imagePullPolicy: Never